name: Daily Progniños run

on:
  schedule:
    - cron: "0 12 * * *"   # 07:00 in Cuenca (UTC-5), after the airport's morning reports
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write           # the job commits the archive and the new report back to the repo

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Progniños
        env:
          # Empty until a commercial Open-Meteo key is added under Settings > Secrets > Actions.
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python progninos.py

      - name: Save archive and report
        run: |
          git config user.name "progninos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive output cache
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git push
          fi
